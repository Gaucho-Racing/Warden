# Where the Warden service lives. In production this is the kerbecs gateway,
# which fronts both the API and the link portal.
warden:
  base-url: "http://localhost:10310"
  # Bearer for /api/plugin/*. Generate with `openssl rand -hex 32` and set the
  # same value as PLUGIN_TOKEN on the service.
  token: ""
  # Per-request timeout. Kept short because a join blocks on the prelogin
  # lookup and a player is waiting.
  timeout-seconds: 5

sync:
  # Full reconcile interval. Cheap: one request that returns every managed
  # group and every linked player.
  interval-seconds: 300

stats:
  enabled: true
  # How often the online players' statistics are reported. Also reported on
  # quit, so this only matters for long uninterrupted sessions.
  #
  # Gathering walks every material twice (mined, crafted) and every living
  # entity type, which is a few thousand map lookups per player. That is
  # microseconds, but it happens on the main thread because Bukkit entity
  # access is not thread safe, so there is no reason to run it often.
  interval-seconds: 600

# Fail closed. If Warden is unreachable a player still joins, but with no
# managed groups and confined to spawn — the same as being unlinked. Nothing
# is cached, so an outage pens the whole server at spawn until Warden is
# back. That is deliberate: if Warden cannot say who somebody is, nobody
# roams.

# Players without warden.play (unlinked, or linked but in no group that grants
# it) join normally but are confined to spawn in adventure mode.
confinement:
  enabled: true
  # Radius in blocks from the world spawn point.
  radius: 32
  # How often the "link your account" action bar may re-appear while a
  # player pushes against the boundary. Movement fires every tick, so this
  # is a throttle rather than a schedule.
  reminder-seconds: 2
  # Shown to linked players without warden.play, in chat on join and in the
  # action bar when they hit a restriction. Name the group that grants it.
  no-access-message: "You must be a member of the MinecraftPlayers group to play on this server!"

# Discord chat bridge. The bot and channel are configured on the Warden
# service; this only decides whether game chat is relayed. The socket itself
# also carries Warden's commands, so it connects whenever either this or
# backups are on.
bridge:
  enabled: true

# Server backups. Warden owns the schedule and the destination; the game
# server is the only party that can read the world volume, so it is the one
# that archives and uploads.
#
# A backup flushes every world and stops autosaving for the length of the
# archive, which players see as a few seconds of lag. The .tar.gz is staged
# in warden-backups/ next to the world and deleted once it is uploaded, so
# the volume needs roughly half the world's size free to run one.
backup:
  enabled: true
  # Ceiling on the upload to presigned storage. Generous because this is
  # gigabytes over one request, not an API call.
  upload-timeout-seconds: 1800
  # Paths relative to the server directory to leave out, as either a file or
  # a directory. The staging directory and session.lock are always excluded.
  exclude: []
